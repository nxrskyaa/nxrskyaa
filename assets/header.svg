<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="ht hd">
  <title id="ht">nxrskyaa</title>
  <desc id="hd">An Aegean dusk — colonnade, cypress, a lighthouse sweeping its beam over a shimmering sea. Wordmark: nxrskyaa, browser games, onchain frontends, agent tools.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#080B0F"/>
      <stop offset="0.42" stop-color="#101720"/>
      <stop offset="0.74" stop-color="#1B242E"/>
      <stop offset="0.92" stop-color="#333A40"/>
      <stop offset="1"    stop-color="#4A463D"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="292" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151D25"/>
      <stop offset="1" stop-color="#090D12"/>
    </linearGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#080B0F" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#080B0F" stop-opacity="0.86"/>
      <stop offset="1"    stop-color="#080B0F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7A76B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C7A76B" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="beam" x1="1042" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#E8D3A2" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#E8D3A2" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#E8D3A2" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="reflect" x1="0" y1="292" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8D3A2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E8D3A2" stop-opacity="0"/>
    </linearGradient>

    <!-- white marble falling into bronze, lit from above -->
    <linearGradient id="marble" x1="0" y1="132" x2="0" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#EFF1F4"/>
      <stop offset="0.60" stop-color="#B3B9C1"/>
      <stop offset="0.83" stop-color="#D9C79D"/>
      <stop offset="1"    stop-color="#A68C5C"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect width="1200" height="400" rx="14"/></clipPath>
    <clipPath id="water"><rect y="292" width="1200" height="108"/></clipPath>

    <style><![CDATA[
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, monospace; }
      .wm   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
              font-size: 74px; font-weight: 700; letter-spacing: -2.2px; }
    ]]></style>

    <mask id="wmMask" maskUnits="userSpaceOnUse" x="56" y="124" width="460" height="100">
      <text class="wm" x="70" y="190" fill="#FFFFFF">nxrskyaa</text>
    </mask>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="292" fill="url(#sky)"/>
    <rect y="292" width="1200" height="108" fill="url(#sea)"/>

    <!-- stars, staggered twinkle -->
    <g fill="#DCE4EC">
      <circle cx="640"  cy="76"  r="1.3"><animate attributeName="opacity" values="0.18;0.72;0.18" dur="5.2s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="712"  cy="120" r="1"  ><animate attributeName="opacity" values="0.12;0.55;0.12" dur="4.1s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="786"  cy="64"  r="1.5"><animate attributeName="opacity" values="0.20;0.80;0.20" dur="6.4s" begin="-1.9s" repeatCount="indefinite"/></circle>
      <circle cx="852"  cy="142" r="1"  ><animate attributeName="opacity" values="0.10;0.48;0.10" dur="3.8s" begin="-0.9s" repeatCount="indefinite"/></circle>
      <circle cx="906"  cy="86"  r="1.2"><animate attributeName="opacity" values="0.16;0.66;0.16" dur="5.7s" begin="-3.4s" repeatCount="indefinite"/></circle>
      <circle cx="968"  cy="58"  r="1"  ><animate attributeName="opacity" values="0.12;0.52;0.12" dur="4.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1042" cy="94"  r="1.3"><animate attributeName="opacity" values="0.18;0.70;0.18" dur="6.0s" begin="-4.1s" repeatCount="indefinite"/></circle>
      <circle cx="1108" cy="146" r="1"  ><animate attributeName="opacity" values="0.10;0.46;0.10" dur="4.3s" begin="-2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="82"  r="1.4"><animate attributeName="opacity" values="0.16;0.64;0.16" dur="5.5s" begin="-0.2s" repeatCount="indefinite"/></circle>
      <circle cx="596"  cy="164" r="1"  ><animate attributeName="opacity" values="0.08;0.40;0.08" dur="4.9s" begin="-3.0s" repeatCount="indefinite"/></circle>
      <circle cx="1006" cy="174" r="1"  ><animate attributeName="opacity" values="0.08;0.42;0.08" dur="5.1s" begin="-1.6s" repeatCount="indefinite"/></circle>
      <circle cx="748"  cy="188" r="1.1"><animate attributeName="opacity" values="0.10;0.44;0.10" dur="6.2s" begin="-2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- crescent moon -->
    <g opacity="0.42">
      <path d="M1112 40a21 21 0 1 0 0 42 25 25 0 0 1 0-42z" fill="#E9E3D5"/>
    </g>

    <!-- far range -->
    <path d="M560 292 L646 242 L704 264 L788 224 L872 260 L960 236 L1060 266 L1200 238 L1200 292 Z" fill="#131A22"/>

    <!-- lighthouse beam, sweeping -->
    <g opacity="0.9">
      <path d="M1042 142 L672 68 L672 204 Z" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate"
          values="-13 1042 142; 11 1042 142; -13 1042 142"
          dur="13s" calcMode="spline"
          keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
          repeatCount="indefinite"/>
      </path>
    </g>

    <!-- right headland + Pharos lighthouse -->
    <path d="M968 292 L1014 234 L1074 246 L1200 268 L1200 292 Z" fill="#1B242C"/>
    <g>
      <path d="M1030 246 L1034 154 L1050 154 L1054 246 Z" fill="#242E37"/>
      <rect x="1031" y="138" width="22" height="17" rx="2" fill="#2C3740"/>
      <path d="M1029 138 L1042 127 L1055 138 Z" fill="#323E48"/>
      <circle cx="1042" cy="146" r="3" fill="#E8D3A2">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M1030 246 L1054 246" stroke="#C7A76B" stroke-opacity="0.22" stroke-width="1"/>
    </g>

    <!-- colonnade -->
    <g fill="#1F272F">
      <path d="M604 204 L700 176 L796 204 Z"/>
      <rect x="604" y="204" width="192" height="7"/>
      <rect x="614" y="211" width="8" height="62"/>
      <rect x="640" y="211" width="8" height="62"/>
      <rect x="666" y="211" width="8" height="62"/>
      <rect x="692" y="211" width="8" height="62"/>
      <rect x="718" y="211" width="8" height="62"/>
      <rect x="744" y="211" width="8" height="62"/>
      <rect x="770" y="211" width="8" height="62"/>
      <rect x="598" y="273" width="204" height="8"/>
    </g>
    <path d="M604 204 L796 204" stroke="#C7A76B" stroke-opacity="0.16" stroke-width="1"/>

    <!-- cypress -->
    <g fill="#182027">
      <path d="M842 286 Q834 258 842 236 Q850 258 842 286 Z"/>
      <path d="M868 286 Q861 264 868 246 Q875 264 868 286 Z"/>
      <path d="M894 286 Q885 254 894 230 Q903 254 894 286 Z"/>
      <path d="M918 286 Q912 266 918 250 Q924 266 918 286 Z"/>
    </g>

    <!-- shoreline -->
    <path d="M560 292 L1200 292" stroke="#5C6873" stroke-opacity="0.28" stroke-width="1"/>

    <!-- sea shimmer -->
    <g clip-path="url(#water)" stroke="#93A6B6" stroke-linecap="round" fill="none">
      <path d="M0 302 H1200" stroke-opacity="0.20" stroke-width="1.1" stroke-dasharray="16 58">
        <animate attributeName="stroke-dashoffset" values="0;-148" dur="17s" repeatCount="indefinite"/>
      </path>
      <path d="M0 313 H1200" stroke-opacity="0.16" stroke-width="1.1" stroke-dasharray="26 74">
        <animate attributeName="stroke-dashoffset" values="0;200" dur="23s" repeatCount="indefinite"/>
      </path>
      <path d="M0 325 H1200" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="12 46">
        <animate attributeName="stroke-dashoffset" values="0;-116" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M0 338 H1200" stroke-opacity="0.15" stroke-width="1.2" stroke-dasharray="34 88">
        <animate attributeName="stroke-dashoffset" values="0;244" dur="28s" repeatCount="indefinite"/>
      </path>
      <path d="M0 352 H1200" stroke-opacity="0.20" stroke-width="1.3" stroke-dasharray="18 62">
        <animate attributeName="stroke-dashoffset" values="0;-160" dur="19s" repeatCount="indefinite"/>
      </path>
      <path d="M0 367 H1200" stroke-opacity="0.14" stroke-width="1.3" stroke-dasharray="42 104">
        <animate attributeName="stroke-dashoffset" values="0;292" dur="31s" repeatCount="indefinite"/>
      </path>
      <path d="M0 383 H1200" stroke-opacity="0.18" stroke-width="1.4" stroke-dasharray="22 70">
        <animate attributeName="stroke-dashoffset" values="0;-184" dur="21s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- lighthouse reflection -->
    <rect x="1035" y="292" width="14" height="108" fill="url(#reflect)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- text scrim -->
    <rect width="680" height="400" fill="url(#scrim)"/>

    <text class="mono" x="72" y="104" font-size="13" letter-spacing="2.6" fill="#727B85">github.com/nxrskyaa</text>

    <!-- wordmark: cast shadow, marble-to-bronze fill, travelling specular sheen -->
    <text class="wm" x="70" y="192.5" fill="#04070A" fill-opacity="0.62">nxrskyaa</text>
    <text class="wm" x="70" y="190" fill="url(#marble)">nxrskyaa</text>
    <g mask="url(#wmMask)">
      <g transform="skewX(-16)">
        <rect y="118" width="150" height="112" fill="url(#sheen)">
          <animateTransform attributeName="transform" type="translate"
            values="-60 0; -60 0; 640 0; 640 0" keyTimes="0;0.07;0.33;1"
            calcMode="spline" keySplines="0 0 1 1; 0.32 0 0.5 1; 0 0 1 1"
            dur="7.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g>
      <path d="M72 218 H470" stroke="#C7A76B" stroke-opacity="0.26" stroke-width="1"/>
      <path d="M72 218 H470" stroke="#E8D3A2" stroke-opacity="0.85" stroke-width="1" stroke-dasharray="56 342">
        <animate attributeName="stroke-dashoffset" values="398;0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <text class="mono" x="72" y="250" font-size="15" fill="#9BA5AF">browser games &#183; onchain frontends &#183; agent tools</text>

    <circle cx="77" cy="282" r="3.5" fill="#C7A76B">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="92" y="286" font-size="12" letter-spacing="1.6" fill="#79828C">CURRENTLY BUILDING ODYVION</text>

    <rect x="0" y="16" width="2.5" height="368" fill="url(#edge)"/>
  </g>

  <rect width="1200" height="400" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
</svg>
