<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="ht hd">
  <title id="ht">nxrskyaa</title>
  <desc id="hd">An Aegean dusk — colonnade, cypress, a lighthouse sweeping its beam over a shimmering sea. Wordmark: nxrskyaa, browser games, onchain frontends, agent tools.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#080B0F"/>
      <stop offset="0.42" stop-color="#101720"/>
      <stop offset="0.74" stop-color="#1B242E"/>
      <stop offset="0.92" stop-color="#333A40"/>
      <stop offset="1"    stop-color="#4A463D"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="320" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151D25"/>
      <stop offset="1" stop-color="#090D12"/>
    </linearGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#080B0F" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#080B0F" stop-opacity="0.86"/>
      <stop offset="1"    stop-color="#080B0F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7A76B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C7A76B" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="beam" x1="1042" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#E8D3A2" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#E8D3A2" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#E8D3A2" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="reflect" x1="0" y1="320" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8D3A2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E8D3A2" stop-opacity="0"/>
    </linearGradient>

    <!-- white marble falling into bronze, lit from above -->
    <linearGradient id="marble" x1="0" y1="136" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#EFF1F4"/>
      <stop offset="0.60" stop-color="#B3B9C1"/>
      <stop offset="0.83" stop-color="#D9C79D"/>
      <stop offset="1"    stop-color="#A68C5C"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect width="1200" height="440" rx="14"/></clipPath>
    <clipPath id="water"><rect y="320" width="1200" height="120"/></clipPath>

    <style><![CDATA[
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, monospace; }
      .wm   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
              font-size: 90px; font-weight: 700; letter-spacing: -2.7px; }
    ]]></style>

    <mask id="wmMask" maskUnits="userSpaceOnUse" x="56" y="118" width="540" height="112">
      <text class="wm" x="70" y="200" fill="#FFFFFF">nxrskyaa</text>
    </mask>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <rect y="320" width="1200" height="120" fill="url(#sea)"/>

    <!-- stars, staggered twinkle -->
    <g fill="#DCE4EC">
      <circle cx="640"  cy="86"  r="1.6"><animate attributeName="opacity" values="0.18;0.72;0.18" dur="5.2s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="712"  cy="130" r="1.2"><animate attributeName="opacity" values="0.12;0.55;0.12" dur="4.1s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="786"  cy="74"  r="1.8"><animate attributeName="opacity" values="0.20;0.80;0.20" dur="6.4s" begin="-1.9s" repeatCount="indefinite"/></circle>
      <circle cx="852"  cy="152" r="1.2"><animate attributeName="opacity" values="0.10;0.48;0.10" dur="3.8s" begin="-0.9s" repeatCount="indefinite"/></circle>
      <circle cx="906"  cy="96"  r="1.4"><animate attributeName="opacity" values="0.16;0.66;0.16" dur="5.7s" begin="-3.4s" repeatCount="indefinite"/></circle>
      <circle cx="968"  cy="68"  r="1.2"><animate attributeName="opacity" values="0.12;0.52;0.12" dur="4.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1042" cy="104" r="1.6"><animate attributeName="opacity" values="0.18;0.70;0.18" dur="6.0s" begin="-4.1s" repeatCount="indefinite"/></circle>
      <circle cx="1108" cy="156" r="1.2"><animate attributeName="opacity" values="0.10;0.46;0.10" dur="4.3s" begin="-2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="92"  r="1.7"><animate attributeName="opacity" values="0.16;0.64;0.16" dur="5.5s" begin="-0.2s" repeatCount="indefinite"/></circle>
      <circle cx="596"  cy="174" r="1.2"><animate attributeName="opacity" values="0.08;0.40;0.08" dur="4.9s" begin="-3.0s" repeatCount="indefinite"/></circle>
      <circle cx="1006" cy="184" r="1.2"><animate attributeName="opacity" values="0.08;0.42;0.08" dur="5.1s" begin="-1.6s" repeatCount="indefinite"/></circle>
      <circle cx="748"  cy="198" r="1.3"><animate attributeName="opacity" values="0.10;0.44;0.10" dur="6.2s" begin="-2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- crescent moon -->
    <g opacity="0.42">
      <path d="M1112 48a21 21 0 1 0 0 42 25 25 0 0 1 0-42z" fill="#E9E3D5"/>
    </g>

    <!-- far range -->
    <path d="M560 320 L646 266 L704 290 L788 248 L872 286 L960 260 L1060 292 L1200 262 L1200 320 Z" fill="#131A22"/>

    <!-- lighthouse beam, sweeping -->
    <g opacity="0.9">
      <path d="M1042 170 L672 92 L672 236 Z" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate"
          values="-13 1042 170; 11 1042 170; -13 1042 170"
          dur="13s" calcMode="spline"
          keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
          repeatCount="indefinite"/>
      </path>
    </g>

    <!-- right headland + Pharos lighthouse -->
    <path d="M968 320 L1014 258 L1074 270 L1200 294 L1200 320 Z" fill="#1B242C"/>
    <g>
      <path d="M1030 270 L1034 172 L1050 172 L1054 270 Z" fill="#242E37"/>
      <rect x="1031" y="156" width="22" height="17" rx="2" fill="#2C3740"/>
      <path d="M1029 156 L1042 145 L1055 156 Z" fill="#323E48"/>
      <circle cx="1042" cy="164" r="3.4" fill="#E8D3A2">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M1030 270 L1054 270" stroke="#C7A76B" stroke-opacity="0.22" stroke-width="1"/>
    </g>

    <!-- colonnade -->
    <g fill="#1F272F">
      <path d="M604 228 L700 198 L796 228 Z"/>
      <rect x="604" y="228" width="192" height="7"/>
      <rect x="614" y="235" width="8" height="66"/>
      <rect x="640" y="235" width="8" height="66"/>
      <rect x="666" y="235" width="8" height="66"/>
      <rect x="692" y="235" width="8" height="66"/>
      <rect x="718" y="235" width="8" height="66"/>
      <rect x="744" y="235" width="8" height="66"/>
      <rect x="770" y="235" width="8" height="66"/>
      <rect x="598" y="301" width="204" height="8"/>
    </g>
    <path d="M604 228 L796 228" stroke="#C7A76B" stroke-opacity="0.16" stroke-width="1"/>

    <!-- cypress -->
    <g fill="#182027">
      <path d="M842 314 Q834 284 842 260 Q850 284 842 314 Z"/>
      <path d="M868 314 Q861 290 868 270 Q875 290 868 314 Z"/>
      <path d="M894 314 Q885 280 894 254 Q903 280 894 314 Z"/>
      <path d="M918 314 Q912 292 918 274 Q924 292 918 314 Z"/>
    </g>

    <!-- shoreline -->
    <path d="M560 320 L1200 320" stroke="#5C6873" stroke-opacity="0.28" stroke-width="1"/>

    <!-- sea shimmer -->
    <g clip-path="url(#water)" stroke="#93A6B6" stroke-linecap="round" fill="none">
      <path d="M0 331 H1200" stroke-opacity="0.20" stroke-width="1.3" stroke-dasharray="16 58">
        <animate attributeName="stroke-dashoffset" values="0;-148" dur="17s" repeatCount="indefinite"/>
      </path>
      <path d="M0 343 H1200" stroke-opacity="0.16" stroke-width="1.3" stroke-dasharray="26 74">
        <animate attributeName="stroke-dashoffset" values="0;200" dur="23s" repeatCount="indefinite"/>
      </path>
      <path d="M0 356 H1200" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="12 46">
        <animate attributeName="stroke-dashoffset" values="0;-116" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M0 370 H1200" stroke-opacity="0.15" stroke-width="1.4" stroke-dasharray="34 88">
        <animate attributeName="stroke-dashoffset" values="0;244" dur="28s" repeatCount="indefinite"/>
      </path>
      <path d="M0 385 H1200" stroke-opacity="0.20" stroke-width="1.5" stroke-dasharray="18 62">
        <animate attributeName="stroke-dashoffset" values="0;-160" dur="19s" repeatCount="indefinite"/>
      </path>
      <path d="M0 401 H1200" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="42 104">
        <animate attributeName="stroke-dashoffset" values="0;292" dur="31s" repeatCount="indefinite"/>
      </path>
      <path d="M0 419 H1200" stroke-opacity="0.18" stroke-width="1.6" stroke-dasharray="22 70">
        <animate attributeName="stroke-dashoffset" values="0;-184" dur="21s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- lighthouse reflection -->
    <rect x="1034" y="320" width="16" height="120" fill="url(#reflect)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- text scrim -->
    <rect width="700" height="440" fill="url(#scrim)"/>

    <text class="mono" x="72" y="106" font-size="16" letter-spacing="3" fill="#7A838D">github.com/nxrskyaa</text>

    <!-- wordmark: cast shadow, marble-to-bronze fill, travelling specular sheen -->
    <text class="wm" x="70" y="203" fill="#04070A" fill-opacity="0.62">nxrskyaa</text>
    <text class="wm" x="70" y="200" fill="url(#marble)">nxrskyaa</text>
    <g mask="url(#wmMask)">
      <g transform="skewX(-16)">
        <rect y="112" width="170" height="124" fill="url(#sheen)">
          <animateTransform attributeName="transform" type="translate"
            values="-80 0; -80 0; 720 0; 720 0" keyTimes="0;0.07;0.33;1"
            calcMode="spline" keySplines="0 0 1 1; 0.32 0 0.5 1; 0 0 1 1"
            dur="7.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g>
      <path d="M72 236 H520" stroke="#C7A76B" stroke-opacity="0.26" stroke-width="1.2"/>
      <path d="M72 236 H520" stroke="#E8D3A2" stroke-opacity="0.85" stroke-width="1.2" stroke-dasharray="64 384">
        <animate attributeName="stroke-dashoffset" values="448;0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <text class="mono" x="72" y="276" font-size="18" fill="#9BA5AF">browser games &#183; onchain frontends &#183; agent tools</text>

    <circle cx="78" cy="308" r="4.2" fill="#C7A76B">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="96" y="313" font-size="14" letter-spacing="1.8" fill="#79828C">CURRENTLY BUILDING ODYVION</text>

    <rect x="0" y="16" width="3" height="408" fill="url(#edge)"/>
  </g>

  <rect width="1200" height="440" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
</svg>
