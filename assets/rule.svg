<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="presentation">
  <defs>
    <pattern id="meander" width="48" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 21 H48 M40 21 V5 H8 V15 H26 V10 H18"
            fill="none" stroke="#C7A76B" stroke-width="1.4" stroke-linecap="square"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="26" fill="url(#fade)"/></mask>
  </defs>

  <g mask="url(#m)" opacity="0.5">
    <g>
      <rect x="-48" width="1296" height="26" fill="url(#meander)"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -48 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
